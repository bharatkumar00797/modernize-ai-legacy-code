name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Modernize every packaged example (offline mock provider)
        run: |
          for ex in py2-style-utils insecure-config old-api-helpers; do
            modernize run "$ex" --out "modernize-output/$ex"
          done

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build and start the hardened container
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Smoke test every packaged example
        run: python3 scripts/smoke_test.py http://127.0.0.1:8000
      - name: Tear down
        if: always()
        run: docker compose down --volumes
