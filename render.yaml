# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the Docker image as a public demo: packaged examples and the offline mock provider.
# To lock it down or use a real LLM, add MODERNIZE_API_KEYS (and MODERNIZE_PROVIDER,
# MODERNIZE_API_KEY, ...) as secret environment variables in the Render dashboard.
services:
  - type: web
    name: modernize-ai-legacy-code
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: MODERNIZE_PROVIDER
        value: mock
      # Render's proxy appends the real client IP to X-Forwarded-For (per-client rate limits)
      - key: MODERNIZE_TRUST_PROXY
        value: "true"
      - key: MODERNIZE_MAX_CONCURRENT_RUNS
        value: "1"
