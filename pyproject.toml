[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "modernize-ai-legacy-code"
version = "0.1.0"
description = "AI legacy code modernization agent: rule-detected smells, LLM-ranked allowlisted refactors, sandboxed and gated by your tests."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bharatkumar Chandvani" }]
requires-python = ">=3.11"
keywords = ["ai", "llm", "ai-agents", "code-modernization", "legacy-code", "refactoring", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  # The verification gate runs the target project's tests with pytest.
  "pytest>=8",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10"]

[project.scripts]
modernize = "modernize.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modernize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
# Packaged legacy fixtures are intentionally old-style (some are not even Python 3).
extend-exclude = ["src/modernize/examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is enforced by ruff format

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/modernize"]
exclude = ["src/modernize/examples/"]
